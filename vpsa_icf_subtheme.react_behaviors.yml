text_area_variant_info:  # part of the key after the :
  id: text_area_style
  label: 'Text Area Style'
  bundles:
    - paragraphs_type|stanford_wysiwyg
  config:
    text_area_style:
      type: select
      title: 'Text Area Style'
      description: Select the text style & Image sizes for displaying this text area.
      default_value: vpsa-text-area--regular
      # Labels quote the circle diameter. Those numbers live in
      # src/scss/theme/_text-area.scss — update both together.
      # Option keys are persisted in paragraph behavior settings and must not
      # be renamed, which is why two of them no longer match their labels.
      options:
        vpsa-text-area--regular: Default (No override)
        vpsa-text-area--fellows: ICF Fellows 293px
        vpsa-text-area--alt-image-styles: ICF Circle 196px
        vpsa-text-area--icf-icon: ICF Icon 140px

layout_variant_info:
  id: layout_style
  label: 'Layout Paragraph Type'
  bundles:
    - paragraphs_type|stanford_layout
  config:
    section_color:
      type: select
      title: Section background color
      description: Choose a background color that spans the full page width. Applies wherever the section sits on the page.
      empty_option: Default
      options:
        vicf-section-color--light-yellow: Light Yellow

# React behaviors plugin definitions for VPSA ICF Subtheme.
# Plugin property $defaults are defined in ReactBehaviorsPluginManager.
banner_variant_info:
  id: banner_type
  label: 'Banner Paragraphs Type'
  bundles:
    - paragraphs_type|stanford_banner
  config:
    banner_variant:
      type: select
      title: 'Banner Style'
      description: Select the display style for this image banner.
      default_value: vicf-banner--default
      options:
        vicf-banner--default: Default
        vicf-banner--quote: Quote Banner
        vicf-banner--caption: Caption Banner
        # Keys keep the `--homepage` wording: option keys are persisted in
        # paragraph behavior settings, so renaming one would orphan every
        # existing author selection. Labels say ICF because the variant is used
        # site-wide, not only on the homepage.
        vicf-banner--homepage: ICF Banner
        vicf-banner--homepage-with-logo: ICF Banner with ICF Logo
        # vicf-banner--two-column-with-logo: Two-Column Banner with ICF Logo Overlay
    banner_overlay:
      type: select
      title: Overlay
      description: Add a tinted overlay over the banner image to improve text contrast.
      empty_option: None
      options:
        vicf-banner-overlay--light: Light tint
        vicf-banner-overlay--medium: Medium tint
        vicf-banner-overlay--dark: Dark tint